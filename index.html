<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>One-for-All</title>
    <meta name="description" content="予定と実績を比べて振り返れる学習管理アプリ" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">One-for-All</p>
          <h1>学習と予定の管理</h1>
        </div>
      </header>

      <main class="layout">
        <aside class="sidebar">
          <nav class="nav" aria-label="メニュー">
            <button class="nav-item active" type="button">日程</button>
            <button class="nav-item" type="button">勉強タイマー</button>
            <button class="nav-item" type="button">記録</button>
            <button class="nav-item" type="button">目標</button>
            <button class="nav-item" type="button">ロケット</button>
            <button class="nav-item" type="button">振り返り</button>
            <button class="nav-item" type="button">今日</button>
          </nav>
        </aside>

        <section class="content">
          <div class="panel calendar-panel">
            <div class="calendar-toolbar">
              <button id="prevMonth" class="icon-button" type="button" aria-label="前の月">‹</button>
              <h2 id="monthLabel">2026年11月</h2>
              <button id="nextMonth" class="icon-button" type="button" aria-label="次の月">›</button>
            </div>

            <div class="weekday-row" aria-label="曜日">
              <span class="weekday sun">日</span>
              <span class="weekday">月</span>
              <span class="weekday">火</span>
              <span class="weekday">水</span>
              <span class="weekday">木</span>
              <span class="weekday">金</span>
              <span class="weekday sat">土</span>
            </div>

            <div id="calendarGrid" class="calendar-grid" aria-live="polite"></div>
          </div>

          <div class="panel summary-panel">
            <div class="section-head">
              <h2 id="selectedDateLabel">2026-11-01</h2>
              <span id="summaryBadge" class="badge">予定どおり</span>
            </div>

            <div class="stats-grid">
              <div class="stat-box">
                <span>予定</span>
                <strong id="plannedMinutes">0分</strong>
              </div>
              <div class="stat-box">
                <span>実績</span>
                <strong id="actualMinutes">0分</strong>
              </div>
              <div class="stat-box">
                <span>達成率</span>
                <strong id="progressRate">0%</strong>
              </div>
            </div>

            <p id="reflectionText" class="reflection-text">今日は良い一日になる予定です。</p>
          </div>

          <div class="feature-row">
            <div class="panel mini-panel">
              <h3>勉強タイマー</h3>
              <div class="timer-display">00:25:00</div>
              <p class="mini-note">今日の学習時間を記録します。</p>
            </div>

            <div class="panel mini-panel">
              <h3>学習記録</h3>
              <ul class="mini-list">
                <li>英語 30分</li>
                <li>数学 40分</li>
                <li>プログラミング 55分</li>
              </ul>
            </div>

            <div class="panel mini-panel">
              <h3>目標</h3>
              <div class="goal-ring">75%</div>
              <p class="mini-note">今週の目標達成率</p>
            </div>

            <div class="panel mini-panel">
              <h3>ロケット</h3>
              <div class="rocket-icon">🚀</div>
              <p class="mini-note">レベル 3</p>
            </div>
          </div>

          <div class="panel form-panel">
            <div class="two-column">
              <div class="card">
                <h3>予定を追加</h3>
                <form id="planForm">
                  <label>
                    <span>タイトル</span>
                    <input id="planTitle" name="title" type="text" placeholder="例: 英文法を3問解く" required />
                  </label>

                  <label>
                    <span>日付</span>
                    <input id="planDate" name="date" type="date" required />
                  </label>

                  <div class="inline-fields">
                    <label>
                      <span>開始</span>
                      <input id="planStart" name="start" type="time" />
                    </label>
                    <label>
                      <span>終了</span>
                      <input id="planEnd" name="end" type="time" />
                    </label>
                  </div>

                  <label>
                    <span>予定時間（分）</span>
                    <input id="planMinutes" name="minutes" type="number" min="1" step="5" placeholder="30" required />
                  </label>

                  <label>
                    <span>カテゴリ</span>
                    <select id="planCategory" name="category">
                      <option value="勉強">勉強</option>
                      <option value="学校">学校</option>
                      <option value="部活">部活</option>
                      <option value="私用">私用</option>
                      <option value="休息">休息</option>
                    </select>
                  </label>

                  <label>
                    <span>メモ</span>
                    <textarea id="planMemo" name="memo" rows="3" placeholder="何をする予定かをメモに残します"></textarea>
                  </label>

                  <button class="primary-button" type="submit">予定を保存</button>
                </form>
              </div>

              <div class="card">
                <h3>実績を記録</h3>
                <form id="logForm">
                  <label>
                    <span>日付</span>
                    <input id="logDate" name="date" type="date" required />
                  </label>

                  <label>
                    <span>やったこと</span>
                    <input id="logTitle" name="title" type="text" placeholder="例: プログラミングの復習" required />
                  </label>

                  <label>
                    <span>実際の時間（分）</span>
                    <input id="logMinutes" name="minutes" type="number" min="1" step="5" placeholder="45" required />
                  </label>

                  <label>
                    <span>感想・メモ</span>
                    <textarea id="logMemo" name="memo" rows="4" placeholder="どんな感じだった？"></textarea>
                  </label>

                  <button class="primary-button" type="submit">実績を保存</button>
                </form>
              </div>
            </div>
          </div>

          <div class="panel list-panel">
            <div class="two-column">
              <div class="card">
                <h3>この日の予定</h3>
                <ul id="planList" class="item-list"></ul>
              </div>

              <div class="card">
                <h3>この日の実績</h3>
                <ul id="logList" class="item-list"></ul>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="./js/app.js" defer></script>
  </body>
</html>
